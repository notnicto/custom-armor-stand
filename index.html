<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
      charset="UTF-8"
    />
    <title>Armor Stand Pack Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div class="container">
      <h1>Armor Stand Pack</h1>

      <div class="pack-box">
        <input type="text" id="name" placeholder="Pack Name" />
      </div>
      <div class="file-wrapper">
        <input type="file" id="packIconInput" accept="image/png" />
        <div class="file-button" id="packIconBtn">Upload Pack Icon</div>
      </div>
      <h3>Upload Armor Stand Skins</h3>

      <div id="textureContainer"></div>
      <div class="actions">
        <button type="button" id="addTextureBtn">Add more skins</button>
        <button class="generate-btn" onclick="generate()">Download pack</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
